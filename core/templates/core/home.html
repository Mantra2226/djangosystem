<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     {% load static %}
    <link rel="stylesheet" href="{% static 'core/styles.css' %}" media="all">
    <title>Dashboard</title>
</head>
<body>
    <div class="container mt-4">
        <h1>Dashboard</h1>
        <div class="row">
            <div class="col-md-3">
                <a href="{% url 'raw_material_form' %}" class="btn btn-primary btn-block mb-3">Add Raw Material</a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'procurement_form' %}" class="btn btn-primary btn-block mb-3">Add Procurement</a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'dispatch_form' %}" class="btn btn-primary btn-block mb-3">Add Dispatch</a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'supplier_list' %}" class="btn btn-primary btn-block mb-3">View Suppliers</a>
            </div>
             </div>
            <div class="row">
            <div class="col-md-3">
                <a href="{% url 'customer_form' %}" class="btn btn-primary btn-block mb-3">Add Customer</a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'invoice_list' %}" class="btn btn-primary btn-block mb-3">View Invoices</a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'loss_record_form' %}" class="btn btn-primary btn-block mb-3">Add Loss Record</a>
            </div>
            <div class="col-md-3">
                <a href="{% url 'financial_entry_form' %}" class="btn btn-primary btn-block mb-3">Add Financial Entry</a>
            </div>
        </div>
    </div>
</body>
</html>
