<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% load static %}
<link rel="stylesheet" href="{% static 'core/styles.css' %}" media="all">
    <title>Loss Record Form</title>   
</head>
<body>
    <div class="container mt-4">
        <h2>Add Loss Record</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="customer">Customer:</label>
                <select class="form-control" id="customer" name="customer" required>
                    <option value="">Select a customer</option>
                    {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="raw_material">Raw Material:</label>
                <select class="form-control" id="raw_material" name="raw_material" required>
                    <option value="">Select a raw material</option>
                    {% for material in raw_materials %}
                        <option value="{{ material.id }}">{{ material.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" class="form-control" id="quantity" name="quantity" min="0" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</body>
</html>
